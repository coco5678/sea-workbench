<!DOCTYPE html>
<html lang="zh-CN" data-theme="farm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="海淘记录中心">
<meta name="description" content="个人海淘记录中心 · 三丽鸥清新手绘贴纸风格">
<link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css?v=10">
<title>清新手绘 · 个人海淘记录中心</title>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span id="logoIcon" class="brand-logo"></span>
      <div class="brand-txt">
        <h1>个人海淘记录中心</h1>
        <div class="sub font-pixel">SEA TRADE · PIXEL WORKBENCH</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="theme-area">
        <span class="theme-label">皮肤</span>
        <div class="theme-btns" id="themeBtns"></div>
      </div>
      <button class="btn ghost" id="btnFull" title="全屏浏览台账">全屏</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar"></div>

  <main class="main">
    <section class="statsbar" id="statsBar" aria-label="数据汇总看板"></section>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <nav class="bottomnav" id="bottomNav" aria-label="主导航"></nav>
</div>

<div class="sheet" id="detailSheet" hidden>
  <div class="sheet-head">
    <div class="right-tabs" id="rightTabs">
      <button class="rt on" data-rt="detail">卡片详情</button>
      <button class="rt" data-rt="tool">物流工具</button>
    </div>
    <button class="icon-btn x" id="sheetClose" title="关闭">×</button>
  </div>
  <div class="sheet-content" id="rightContent"></div>
</div>

<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn x" id="modalClose" title="关闭">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="./js/icons.js?v=7"></script>
<script src="./js/app.js?v=9"></script>
</body>
</html>
